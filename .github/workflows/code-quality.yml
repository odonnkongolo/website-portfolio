name: Code Quality & Security Scans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: JSON Linting & Validation
  # ─────────────────────────────────────────────
  lint-json:
    name: 🗂️ JSON Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install jsonlint
        run: npm install -g jsonlint

      - name: Validate all JSON files
        run: |
          echo "Scanning for JSON files..."
          find . \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -name '*.json' | while read -r file; do
            echo "→ Validating: $file"
            jsonlint "$file" --quiet
          done
          echo "✅ All JSON files are valid."

  # ─────────────────────────────────────────────
  # JOB 2: Node.js — ESLint + npm audit
  # ─────────────────────────────────────────────
  scan-nodejs:
    name: 🟩 Node.js Scan (ESLint + npm audit)
    runs-on: ubuntu-latest
    needs: lint-json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      - name: Generate ESLint JSON report (on failure)
        if: failure()
        run: npx eslint . --format json --output-file eslint-report.json || true

      - name: Run npm audit (security vulnerabilities)
        run: npm audit --audit-level=moderate
        continue-on-error: false

      - name: Upload ESLint report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Python — Ruff Linter
  # ─────────────────────────────────────────────
  scan-python-ruff:
    name: 🐍 Python Scan — Ruff Linter
    runs-on: ubuntu-latest
    needs: scan-nodejs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check for Python files
        id: py-check
        run: |
          COUNT=$(find . \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -name '*.py' | wc -l | tr -d ' ')
          echo "py_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT Python file(s)."

      - name: Run Ruff linter
        if: steps.py-check.outputs.py_count != '0'
        run: |
          ruff check . \
            --exclude node_modules,dist,.git \
            --output-format=github

      - name: Skip — No Python files found
        if: steps.py-check.outputs.py_count == '0'
        run: echo "ℹ️ No Python files detected. Skipping Ruff scan."

  # ─────────────────────────────────────────────
  # JOB 4: Python — Bandit Security Scanner
  # ─────────────────────────────────────────────
  scan-python-bandit:
    name: 🔐 Python Scan — Bandit Security
    runs-on: ubuntu-latest
    needs: scan-python-ruff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Check for Python files
        id: py-check
        run: |
          COUNT=$(find . \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -name '*.py' | wc -l | tr -d ' ')
          echo "py_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT Python file(s)."

      - name: Run Bandit security scan
        if: steps.py-check.outputs.py_count != '0'
        run: |
          bandit -r . \
            --exclude ./node_modules,./dist,./.git \
            --severity-level medium \
            --confidence-level medium \
            --format screen

      - name: Skip — No Python files found
        if: steps.py-check.outputs.py_count == '0'
        run: echo "ℹ️ No Python files detected. Skipping Bandit scan."

      - name: Upload Bandit report (on failure)
        if: failure() && steps.py-check.outputs.py_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7
